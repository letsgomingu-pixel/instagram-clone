<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fafafa" />
    <title>오프라인 | i am not a fishmonger</title>
    <style>
      :root {
        color-scheme: light;
      }
      * { box-sizing: border-box; }
      html, body {
        height: 100%;
        margin: 0;
        font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #fafafa;
        color: #262626;
      }
      main {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        padding-top: calc(24px + env(safe-area-inset-top, 0px));
        padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px));
        text-align: center;
      }
      img {
        width: 96px;
        height: 96px;
        border-radius: 22px;
        margin-bottom: 20px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 24px;
        color: #8e8e8e;
        font-size: 14px;
        line-height: 1.5;
      }
      button {
        height: 44px;
        padding: 0 20px;
        border: 0;
        border-radius: 12px;
        background: #0095f6;
        color: #fff;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon-192.png" alt="i am not a fishmonger" />
      <h1>오프라인 상태입니다</h1>
      <p>네트워크에 연결되면 수산물 상품과 후기를 다시 불러올 수 있습니다.</p>
      <button type="button" onclick="location.href='/'">다시 시도</button>
    </main>
  </body>
</html>
