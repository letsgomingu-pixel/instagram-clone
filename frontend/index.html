  <body>
    <div id="pwa-static-hint" role="region" aria-label="앱 설치">
      <img src="/icon-192.png" width="40" height="40" alt="" />
      <div class="pwa-static-hint__text">
        <strong>앱처럼 사용하기</strong>
        <span id="pwa-static-copy">브라우저 메뉴(⋮)에서 ‘홈 화면에 추가’ 또는 ‘앱 설치’를 선택하세요. 아이폰은 공유 → 홈 화면에 추가입니다.</span>
      </div>
      <button id="pwa-static-install" type="button" hidden>설치</button>
      <button id="pwa-static-close" type="button" aria-label="닫기">닫기</button>
    </div>
    <style>
      #pwa-static-hint {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 12px;
        padding-top: calc(12px + env(safe-area-inset-top, 0px));
        background: #0095f6;
        color: #fff;
        font-family: "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        flex-shrink: 0;
        position: sticky;
        top: 0;
        z-index: 2147483647;
      }
      #pwa-static-hint[hidden] { display: none !important; }
      #pwa-static-hint img { border-radius: 10px; flex-shrink: 0; background: #fff; }
      .pwa-static-hint__text { min-width: 0; flex: 1; }
      .pwa-static-hint__text strong { display: block; font-size: 15px; font-weight: 700; }
      .pwa-static-hint__text span { display: block; margin-top: 2px; font-size: 12px; line-height: 1.4; color: rgba(255,255,255,0.92); }
      #pwa-static-install {
        flex-shrink: 0;
        height: 32px;
        padding: 0 12px;
        border: 0;
        border-radius: 10px;
        background: #fff;
        color: #0095f6;
        font-size: 12px;
        font-weight: 700;
      }
      #pwa-static-close {
        flex-shrink: 0;
        border: 0;
        background: transparent;
        color: #fff;
        font-size: 12px;
        font-weight: 700;
        padding: 4px;
      }
    </style>
    <script>
      (function () {
        var box = document.getElementById('pwa-static-hint');
        var copy = document.getElementById('pwa-static-copy');
        var closeBtn = document.getElementById('pwa-static-close');
        if (!box) return;
        var standalone =
          window.matchMedia('(display-mode: standalone)').matches ||
          (window.navigator.standalone === true);
        var dismissed = false;
        try {
          dismissed =
            localStorage.getItem('pwa-install-dismissed-v3') === '1';
        } catch (e) {}
        if (standalone || dismissed) {
          box.hidden = true;
          return;
        }
        var ua = navigator.userAgent || '';
        if (/KAKAOTALK|NAVER|FBAN|FBAV|Instagram|Line\//i.test(ua)) {
          copy.textContent = '카카오톡 등 앱 안에서는 설치할 수 없습니다. Chrome 또는 Safari로 연 뒤 홈 화면에 추가하세요.';
        } else if (/iphone|ipod|ipad/i.test(ua)) {
          copy.textContent = '하단 공유 버튼을 누른 다음 ‘홈 화면에 추가’를 선택하세요.';
        }
        closeBtn.addEventListener('click', function () {
          try { localStorage.setItem('pwa-install-dismissed-v3', '1'); } catch (e) {}
          box.hidden = true;
        });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
