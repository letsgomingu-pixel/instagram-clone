# nginx server block for iamnotafishmonger.com
#
# Install path: /etc/nginx/sites-available/iamnotafishmonger.com
# Enable with:  sudo ln -s /etc/nginx/sites-available/iamnotafishmonger.com /etc/nginx/sites-enabled/
#
# This file starts as a plain HTTP (port 80) server. Run certbot afterwards
# (see deploy/README.md) — it edits this same file in place to add the
# HTTPS server block and the automatic http -> https redirect. Don't
# hand-add SSL directives here before running certbot once.

server {
    listen 80;
    listen [::]:80;
    server_name iamnotafishmonger.com www.iamnotafishmonger.com;

    root /var/www/iamnotafishmonger/frontend/dist;
    index index.html;

    client_max_body_size 15M;

    # React Router: let unknown paths fall back to index.html. The trailing
    # =404 matters: without it, if index.html itself can't be read (e.g. a
    # permissions problem), nginx retries /index.html forever and logs
    # "rewrite or internal redirection cycle" instead of a clean error.
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # Uploaded media served by FastAPI's StaticFiles mount.
    location /media/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI backend (includes /api/v1/... and /docs Swagger UI).
    location ~ ^/(api|docs|redoc|openapi.json)(/|$) {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
