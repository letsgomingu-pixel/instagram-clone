name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy (PM2)
    runs-on: ubuntu-latest
    steps:
      - name: Validate deploy secrets
        run: |
          missing=0
          if [ -z "${{ secrets.server_host }}" ]; then echo "::error::Missing GitHub secret: server_host"; missing=1; fi
          if [ -z "${{ secrets.server_user }}" ]; then echo "::error::Missing GitHub secret: server_user"; missing=1; fi
          if [ -z "${{ secrets.server_ssh_key }}" ]; then echo "::error::Missing GitHub secret: server_ssh_key"; missing=1; fi
          if [ "$missing" -ne 0 ]; then exit 1; fi
          echo "Deploy secrets are configured."

      - name: Deploy via SSH
        id: ssh
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.server_host }}
          username: ${{ secrets.server_user }}
          key: ${{ secrets.server_ssh_key }}
          port: 22
          timeout: 60s
          debug: true
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail

            DEPLOY_PATH="/var/www/iamnotafishmonger"
            REPO_URL="https://github.com/letsgomingu-pixel/instagram-clone.git"
            RAW_DEPLOY_URL="https://raw.githubusercontent.com/letsgomingu-pixel/instagram-clone/main/deploy.sh"

            log() { echo "[gha-deploy] $*"; }

            if [[ ! -d "$DEPLOY_PATH" ]]; then
              log "Creating deploy directory (needs write access to $(dirname "$DEPLOY_PATH"))..."
              mkdir -p "$(dirname "$DEPLOY_PATH")" || {
                log "ERROR: cannot create $(dirname "$DEPLOY_PATH")."
                log "On EC2 run once: sudo mkdir -p $DEPLOY_PATH && sudo chown -R $USER:$USER $DEPLOY_PATH"
                exit 1
              }
            fi

            if [[ ! -d "$DEPLOY_PATH/.git" ]]; then
              log "First deploy — cloning repository..."
              git clone "$REPO_URL" "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"

            if [[ ! -f deploy.sh ]]; then
              log "deploy.sh missing — downloading from main branch..."
              curl -fsSL "$RAW_DEPLOY_URL" -o deploy.sh
              chmod +x deploy.sh
            fi

            chmod +x deploy.sh
            bash deploy.sh

      - name: Deployment succeeded
        if: success()
        run: echo "Deploy completed successfully."

      - name: Deployment failed
        if: failure()
        run: |
          echo "::error::Deploy failed. Check the SSH step logs above."
          exit 1
