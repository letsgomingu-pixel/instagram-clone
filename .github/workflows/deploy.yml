name: Deploy to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy (PM2)
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        id: ssh
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.server_host }}
          username: ${{ secrets.server_user }}
          key: ${{ secrets.server_ssh_key }}
          script_stop: true
          command_timeout: 30m
          script: |
            set -euo pipefail

            DEPLOY_PATH="/var/www/iamnotafishmonger"
            REPO_URL="https://github.com/letsgomingu-pixel/instagram-clone.git"
            RAW_DEPLOY_URL="https://raw.githubusercontent.com/letsgomingu-pixel/instagram-clone/main/deploy.sh"

            log() { echo "[gha-deploy] $*"; }

            mkdir -p "$(dirname "$DEPLOY_PATH")"

            if [[ ! -d "$DEPLOY_PATH/.git" ]]; then
              log "First deploy — cloning repository..."
              git clone "$REPO_URL" "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"

            if [[ ! -f deploy.sh ]]; then
              log "deploy.sh missing — downloading from main branch..."
              curl -fsSL "$RAW_DEPLOY_URL" -o deploy.sh
              chmod +x deploy.sh
            fi

            chmod +x deploy.sh
            bash deploy.sh

      - name: Deployment succeeded
        if: success()
        run: echo "Deploy completed successfully."

      - name: Deployment failed
        if: failure()
        run: |
          echo "::error::Deploy failed. Check the SSH step logs above."
          exit 1
